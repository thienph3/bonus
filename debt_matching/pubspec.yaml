name: debt_matching
description: "Debt Matching - Tính chiết khấu thanh toán đúng hạn"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management
  flutter_riverpod: ^3.3.1
  # Database
  drift: ^2.33.0
  path_provider: ^2.1.5
  path: ^1.9.1
  # Excel
  spreadsheet_decoder: ^2.3.0
  excel: ^4.0.6
  # File picker
  file_picker: ^11.0.2
  # UUID
  uuid: ^4.5.1
  # Date formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Drift code generation
  drift_dev: ^2.33.0
  build_runner: ^2.15.0
  test: ^1.30.0
  image: ^4.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/template.xlsx
    - assets/initial_state.png
    - assets/export_success.png
    - assets/error_state.png
